<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="titleIndex">{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" data-i18n-meta="metaDescIndex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    {{JSONLD}}
  </head>
  <body>

    <!-- Notice overlay -->
    <div class="notice-overlay" id="noticeOverlay" role="dialog" aria-modal="true" aria-labelledby="noticeHeading" aria-hidden="true">
      <div class="notice-card">
        <h3 id="noticeHeading" data-i18n="noticeTitle">Muy pronto estará disponible el mejor sistema de gestión hotelera.</h3>
        <p data-i18n="noticeBody">Estamos afinando los últimos detalles para abrir acceso completo.</p>
        <button class="btn secondary" type="button" id="noticeClose" data-i18n="noticeButton">Entendido</button>
      </div>
    </div>

    <!-- Background layer -->
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-dots"></div>
      <div class="bg-blob one"></div>
      <div class="bg-blob two"></div>
      <div class="bg-blob three"></div>
    </div>

    <div class="page">

      <!-- Header -->
      <header>
        <div class="brand">
          <a href="index.html" class="logo"><img src="ico/kazehanalogo.png" alt="Kazehana logo" /></a>
          <a href="index.html" class="brand-name">Kazehana Cloud PMS</a>
        </div>
        <div class="header-actions">
          <nav>
            <a href="index.html" data-i18n="navPlatform"{{ACTIVE_PLATFORM}}><span>Platform</span></a>
            <a href="modules.html" data-i18n="navModules"{{ACTIVE_MODULES}}><span>Modules</span></a>
            <a href="workflow.html" data-i18n="navWorkflow"{{ACTIVE_WORKFLOW}}><span>Workflow</span></a>
            <a href="faq.html" data-i18n="navFaq"{{ACTIVE_FAQ}}><span>FAQ</span></a>
            <a href="contact.html" data-i18n="navContact"{{ACTIVE_CONTACT}}><span>Contact</span></a>
          </nav>
          <a class="btn secondary header-login" href="https://client.kazehanacloud.com" data-i18n="navLogin">Log in</a>
          <div class="lang-select">
            <label for="langSelect" data-i18n="languageLabel">Language</label>
            <select id="langSelect" aria-label="Language selector"></select>
          </div>
        </div>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </header>
